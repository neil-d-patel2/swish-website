<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <script>
      // GitHub Pages SPA redirect: encode the path into the query string
      // so index.html can restore it via history.replaceState.
      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname.split("/").slice(0, 2).join("/") +
          "/?p=" +
          encodeURIComponent(
            l.pathname.slice(l.pathname.indexOf("/", 1)) +
              (l.search ? "&q=" + encodeURIComponent(l.search.slice(1)) : "") +
              l.hash
          )
      );
    </script>
  </head>
  <body></body>
</html>
